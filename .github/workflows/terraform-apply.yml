name: Apply approved VPC Terraform

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    # Configure this environment with required reviewers. This is an
    # independent approval gate after the generated PR has been reviewed and
    # merged to main.
    environment: terraform-apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: terraform -chdir=generated/vpc init -input=false
      - run: terraform -chdir=generated/vpc plan -input=false
      - run: terraform -chdir=generated/vpc apply -input=false -auto-approve
