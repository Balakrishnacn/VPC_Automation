name: Terraform validation

on:
  pull_request:
    paths:
      - "modules/**/*.tf"
      - "generated/**/*.tf"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=modules/vpc fmt -check -recursive
      - run: terraform -chdir=modules/vpc init -backend=false
      - run: terraform -chdir=modules/vpc validate
      - run: terraform -chdir=generated/vpc fmt -check -recursive
      - run: terraform -chdir=generated/vpc init -backend=false
      - run: terraform -chdir=generated/vpc validate
